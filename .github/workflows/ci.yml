name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore FitnessCoach.slnx

      - name: Compilar
        run: dotnet build FitnessCoach.slnx --no-restore

      - name: Correr pruebas
        run: dotnet test FitnessCoach.Tests/FitnessCoach.Tests.csproj --no-build --verbosity normal